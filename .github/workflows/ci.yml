name: Backend CI

on:
  push:
    branches: [ "main", "sprint-*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: fpl_lens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d fpl_lens_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install ruff mypy pytest pytest-asyncio pytest-cov

      - name: Run linter (Ruff)
        run: |
          ruff check .

      - name: Run type checker (Mypy)
        run: |
          python -m mypy src


      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/fpl_lens_test
        run: |
          python -m alembic upgrade head

      - name: Run test suite
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/fpl_lens_test
        run: |
          pytest -v
