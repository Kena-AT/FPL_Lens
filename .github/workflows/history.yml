name: Schedule Match History Ingestion

on:
  schedule:
    # Run hourly on normal days (can be run */15 * * * * on match days)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  trigger-history:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger History Job
        run: |
          STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "${{ secrets.BACKEND_URL }}/internal/jobs/history" \
            -H "X-Job-Token: ${{ secrets.JOB_TOKEN }}" \
            -H "Content-Type: application/json")
          echo "HTTP Status: $STATUS"
          cat response.json
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "History job failed with status $STATUS"
            exit 1
          fi
