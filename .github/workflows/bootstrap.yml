name: Schedule Bootstrap Ingestion

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  trigger-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Bootstrap Job
        run: |
          STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "${{ secrets.BACKEND_URL }}/internal/jobs/bootstrap" \
            -H "X-Job-Token: ${{ secrets.JOB_TOKEN }}" \
            -H "Content-Type: application/json")
          echo "HTTP Status: $STATUS"
          cat response.json
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Bootstrap job failed with status $STATUS"
            exit 1
          fi
