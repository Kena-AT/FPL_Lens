name: Repository Activity Check

on:
  schedule:
    # Run on the 1st of every month to check activity and prevent workflow suspension
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  activity-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Repository Activity
        run: |
          LAST_COMMIT_DATE=$(git log -1 --format=%cd --date=iso)
          echo "Latest repository commit date: $LAST_COMMIT_DATE"
          echo "Repository activity verified successfully."
