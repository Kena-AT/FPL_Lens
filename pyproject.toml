[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fpl-lens"
version = "0.1.0"
description = "FPL Lens Backend Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.31",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "python-json-logger>=3.2.0",
    "google-auth>=2.32.0",
    "requests>=2.32.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_lens"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "BLE", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = [
    "fpl_lens.api.routes.auth",
    "fpl_lens.api.routes.me",
    "fpl_lens.services.token",
    "fpl_lens.services.ingestion",
    "fpl_lens.services.cache",
    "fpl_lens.api.app",
]
ignore_errors = true


